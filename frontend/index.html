<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/greenstone-favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/greenstone-favicon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/greenstone-apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1f1a" />
    <meta name="description" content="Professional residential and commercial painting across Waikato. Request a free quote from Greenstone Painting Limited." />
    <title>Greenstone Painting | Waikato Painters</title>
  </head>
  <body>
    <!-- Static definition used by Netlify's build-time form detector. -->
    <form name="quote-request" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="quote-request" />
      <input name="bot-field" />
      <input name="reference" />
      <input name="firstName" />
      <input name="lastName" />
      <input name="email" type="email" />
      <input name="phone" />
      <input name="propertyAddress" />
      <input name="service" />
      <textarea name="message"></textarea>
      <input name="privacyAccepted" />
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
