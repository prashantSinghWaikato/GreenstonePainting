spring.application.name=backend
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/greenstone_painting}
spring.datasource.username=${DB_USERNAME:greenstone}
spring.datasource.password=${DB_PASSWORD:greenstone}
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:10}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}
app.content.directory=${CONTENT_DIRECTORY:./data/uploads}

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties[mail.smtp.auth]=${MAIL_SMTP_AUTH:false}
spring.mail.properties[mail.smtp.starttls.enable]=${MAIL_STARTTLS:false}
spring.mail.properties[mail.smtp.connectiontimeout]=5000
spring.mail.properties[mail.smtp.timeout]=5000
spring.mail.properties[mail.smtp.writetimeout]=5000
app.mail.delivery-enabled=${MAIL_DELIVERY_ENABLED:true}

app.notification.to=${QUOTE_NOTIFICATION_TO:quotes@greenstone.local}
app.notification.from=${QUOTE_NOTIFICATION_FROM:no-reply@greenstone.local}
