spring.application.name=backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/greenstone_painting}
spring.datasource.username=${DB_USERNAME:greenstone}
spring.datasource.password=${DB_PASSWORD:greenstone}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}
app.upload.directory=${UPLOAD_DIRECTORY:./data/uploads}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
