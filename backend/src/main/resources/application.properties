spring.application.name=backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/greenstone_painting}
spring.datasource.username=${DB_USERNAME:greenstone}
spring.datasource.password=${DB_PASSWORD:greenstone}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}
app.upload.directory=${UPLOAD_DIRECTORY:./data/uploads}

app.admin.bootstrap.email=${ADMIN_EMAIL:}
app.admin.bootstrap.password=${ADMIN_PASSWORD:}
app.admin.bootstrap.display-name=${ADMIN_DISPLAY_NAME:Greenstone Admin}

server.servlet.session.timeout=${ADMIN_SESSION_TIMEOUT:8h}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties[mail.smtp.auth]=${MAIL_SMTP_AUTH:false}
spring.mail.properties[mail.smtp.starttls.enable]=${MAIL_STARTTLS:false}
spring.mail.properties[mail.smtp.connectiontimeout]=5000
spring.mail.properties[mail.smtp.timeout]=5000
spring.mail.properties[mail.smtp.writetimeout]=5000

app.notification.to=${QUOTE_NOTIFICATION_TO:quotes@greenstone.local}
app.notification.from=${QUOTE_NOTIFICATION_FROM:no-reply@greenstone.local}
app.notification.automation-enabled=${NOTIFICATION_AUTOMATION_ENABLED:true}
app.notification.follow-up-cron=${FOLLOW_UP_NOTIFICATION_CRON:0 * * * * *}
app.notification.daily-digest-cron=${DAILY_DIGEST_CRON:0 0 8 * * MON-FRI}
app.public-base-url=${PUBLIC_BASE_URL:http://localhost:8080}
app.frontend-base-url=${FRONTEND_PUBLIC_BASE_URL:http://localhost:5173}
