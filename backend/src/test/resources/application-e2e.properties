spring.datasource.url=jdbc:h2:mem:greenstone-e2e;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

app.notification.automation-enabled=false
app.notification.to=e2e-team@example.test
app.notification.from=e2e-no-reply@example.test
app.public-base-url=http://127.0.0.1:18080
app.frontend-base-url=http://127.0.0.1:15173
app.cors.allowed-origin=http://127.0.0.1:15173
app.upload.directory=./build/e2e-uploads

server.port=18080
