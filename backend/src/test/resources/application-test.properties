spring.datasource.url=jdbc:h2:mem:greenstone;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

spring.mail.host=localhost
spring.mail.port=1025
app.notification.to=quotes@example.com
app.notification.from=no-reply@example.com
app.public-base-url=http://localhost:8080
